# 使用 GLiNER + REBEL 生成的训练集完整 KG 和全局段落候选库。
dataset:
  name: hotpotqa
  path: data/hotpot_train.json

graph:
  extractions_path: outputs/kg_train_gliner_rebel/kg_extractions.jsonl
  lexical_fallback: false

embedding:
  backend: sentence_transformer
  model: BAAI/bge-base-en-v1.5
  device: cuda

global_retrieval:
  enabled: true
  corpus_inputs:
    - data/hotpot_train_paragraphs.json
  asset_dir: outputs/hotpotqa_global_assets/train
  corpus_path: outputs/hotpotqa_global_assets/train/corpus.jsonl
  embeddings_path: outputs/hotpotqa_global_assets/train/paragraph_embeddings.npy
  faiss_index_path: outputs/hotpotqa_global_assets/train/paragraphs.faiss
  graph_index_path: outputs/hotpotqa_global_assets/train/global_graph.sqlite
  manifest_path: outputs/hotpotqa_global_assets/train/manifest.json
  index_backend: faiss
  embedding_batch_size: 256
  query_batch_size: 256
  graph_workers: null
  output_shard_size: 1024
  semantic_top_k: 500
  seed_paragraph_k: 20
  graph_hops: 2
  max_graph_candidates: 1000
  max_entities_per_hop: 500
  max_relations_per_entity: 100
  max_paragraphs_per_entity: 100
  max_paths_per_candidate: 3

retrieval:
  top_k: 100
  hops: 2
  seed_k: 8
  max_paths_per_candidate: 3
  semantic_weight: 0.5
  graph_weight: 0.5

ranker:
  top_k: 20
  model: set_transformer
  hidden_dim: 256
  num_heads: 8
  num_layers: 3
  feedforward_dim: 1024
  dropout: 0.1
  device: cuda
  representation_output_dim: 16
  checkpoint: null
  inference_split: validation

ranker_dataset:
  graphrag_path: outputs/hotpotqa/hotpot_train_global_graphrag/graphrag.jsonl
  output_dir: outputs/hotpotqa/hotpot_train_global_graphrag/ranker_dataset
  manifest: outputs/hotpotqa/hotpot_train_global_graphrag/ranker_dataset/manifest.json
  candidate_k: 100
  shard_size: 512
  storage_dtype: float16
  validation_fraction: 0.1
  split_seed: 13

training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.01
  seed: 13
  loss: listwise
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  amp: true
  amp_dtype: bfloat16
  max_grad_norm: 1.0
  checkpoint_dir: outputs/hotpotqa/hotpot_train_global_graphrag/ranker_checkpoints

llm:
  provider: passthrough
  model: null
  top_k: 10
  prompt_version: v1
  cache_dir: llm_cache
  max_text_chars: 4000

evaluation:
  split: validation
  ks: [5, 10]

output:
  root: outputs
  experiment: hotpot_train_global_graphrag
