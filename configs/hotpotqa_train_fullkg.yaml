# 使用 GLiNER + REBEL 生成的训练集完整 KG。
dataset:
  name: hotpotqa
  path: data/hotpot_train.json

graph:
  extractions_path: outputs/kg_train_gliner_rebel/kg_extractions.jsonl
  lexical_fallback: false

embedding:
  backend: hashing
  dimension: 256
  ngrams: 2

retrieval:
  top_k: 100
  hops: 2
  seed_k: 8
  max_paths_per_candidate: 3
  semantic_weight: 0.5
  graph_weight: 0.5

ranker:
  top_k: 20
  model: mlp
  hidden_dim: 256
  dropout: 0.1
  device: cpu
  representation_output_dim: 16
  checkpoint: null

training:
  epochs: 100
  learning_rate: 0.001
  seed: 13

llm:
  provider: passthrough
  model: null
  top_k: 10
  prompt_version: v1
  cache_dir: llm_cache
  max_text_chars: 4000

evaluation:
  ks: [5, 10, 20, 100]

output:
  root: outputs
  experiment: hotpot_train_fullkg_graphrag
