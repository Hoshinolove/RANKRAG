# 使用 GLiNER + REBEL 生成的训练集完整 KG。
dataset:
  name: hotpotqa
  path: data/hotpot_train.json

graph:
  extractions_path: outputs/kg_train_gliner_rebel/kg_extractions.jsonl
  lexical_fallback: false

embedding:
  backend: hashing
  dimension: 256
  ngrams: 2

retrieval:
  top_k: 100
  hops: 2
  seed_k: 8
  max_paths_per_candidate: 3
  semantic_weight: 0.5
  graph_weight: 0.5

ranker:
  top_k: 20
  model: set_transformer
  hidden_dim: 256
  num_heads: 8
  num_layers: 3
  feedforward_dim: 1024
  dropout: 0.1
  device: cuda
  representation_output_dim: 16
  checkpoint: null

ranker_dataset:
  graphrag_path: outputs/hotpotqa/hotpot_train_fullkg_graphrag/graphrag.jsonl
  output_dir: outputs/hotpotqa/hotpot_train_fullkg_graphrag/ranker_dataset
  manifest: outputs/hotpotqa/hotpot_train_fullkg_graphrag/ranker_dataset/manifest.json
  candidate_k: 100
  shard_size: 512
  storage_dtype: float16
  validation_fraction: 0.1
  split_seed: 13

training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.01
  seed: 13
  loss: listwise
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  amp: true
  amp_dtype: bfloat16
  max_grad_norm: 1.0
  checkpoint_dir: outputs/hotpotqa/hotpot_train_fullkg_graphrag/ranker_checkpoints

llm:
  provider: passthrough
  model: null
  top_k: 10
  prompt_version: v1
  cache_dir: llm_cache
  max_text_chars: 4000

evaluation:
  ks: [5, 10]

output:
  root: outputs
  experiment: hotpot_train_fullkg_graphrag
